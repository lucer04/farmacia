<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <title>Sin conexión | Farmacia San Juan</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172033; }
        main { max-width: 32rem; margin: 1.5rem; padding: 2rem; background: #fff; border-radius: 1rem; box-shadow: 0 1rem 3rem #17203318; text-align: center; }
        h1 { margin-top: 0; color: #0d6efd; }
        p { line-height: 1.6; }
        button { padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #0d6efd; color: white; font: inherit; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Estás sin conexión</h1>
        <p>No se pudo conectar con el sistema. Vuelve a conectarte a Internet para consultar o actualizar datos.</p>
        <p>Por seguridad, la información de clientes, ventas e inventario no está disponible sin conexión.</p>
        <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
</body>
</html>
